<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My To-Do List</title>
  <meta name="description" content="A to-do list with time limits, snoozes and achievements.">

  <!-- ---------- Installable app (PWA) settings ----------
       The manifest tells the phone or computer the app's name, icons and colors. -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e6edf1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11191e" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <!-- iPhone and iPad use these instead of the manifest for the home screen icon and name -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-Do">

  <!-- ============================================================
       STYLES (CSS): how the page looks
       ============================================================ -->
  <style>
    /* Colors live in one place. Change a value here and it changes everywhere. */
    :root {
      color-scheme: light dark;
      --bg: #e6edf1;
      --card: #ffffff;
      --ink: #1a2b34;
      --muted: #5b6b75;
      --line: #d5dee4;
      --accent: #0e6b73;
      --accent-ink: #ffffff;
      --done: #8a98a1;
      --danger: #b3261e;

      /* New: colors for winning, running low on time, and failing */
      --good: #1f7a3d;
      --good-tint: rgba(31, 122, 61, 0.16);
      --warn: #94590a;
      --alert: #b3261e;
      --alert-tint: rgba(179, 38, 30, 0.08);
      --alert-tint-strong: rgba(179, 38, 30, 0.22);
    }

    /* Automatically switch to dark colors if the phone or computer is in dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11191e;
        --card: #1a252c;
        --ink: #e6eef2;
        --muted: #9baab4;
        --line: #2b3a43;
        --accent: #4fb8c0;
        --accent-ink: #0b1a1d;
        --done: #6f7f89;
        --danger: #f2b8b5;

        --good: #6fd39a;
        --good-tint: rgba(111, 211, 154, 0.18);
        --warn: #f0b45a;
        --alert: #ff8a80;
        --alert-tint: rgba(255, 138, 128, 0.10);
        --alert-tint-strong: rgba(255, 138, 128, 0.26);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      /* The max() keeps the usual spacing, but adds room for phone notches and the home bar */
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.45;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      width: 100%;
      max-width: 520px;
      margin-top: 4vh;
      padding: 28px 24px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(20, 40, 50, 0.08);
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    #count {
      margin: 4px 0 20px;
      color: var(--muted);
      font-size: 15px;
      transform-origin: left center;
    }

    /* The "add a task" row */
    .add-row { display: flex; gap: 8px; }

    .add-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 10px;
    }

    .add-row input::placeholder { color: var(--muted); }

    button {
      font: inherit;
      cursor: pointer;
    }

    .add-row button {
      padding: 12px 18px;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: none;
      border-radius: 10px;
    }

    /* New: the "time limit" picker under the add row */
    .limit-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .limit-row select {
      flex: 1;
      min-width: 0;
      max-width: 260px;
      padding: 8px 10px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 10px;
    }

    .hint {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .hint:empty { display: none; }

    /* Keyboard users can always see where they are */
    input:focus-visible,
    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* The All / To do / Done buttons */
    .filters {
      display: flex;
      gap: 6px;
      margin: 20px 0 8px;
    }

    .filters button {
      padding: 6px 14px;
      font-size: 15px;
      color: var(--muted);
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 999px;
    }

    .filters button[aria-pressed="true"] {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
    }

    /* The list itself */
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      position: relative;
      isolation: isolate; /* keeps the colored glow (li::before) behind the text */
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    li:last-child { border-bottom: none; }

    /* An invisible colored layer behind each task.
       We fade it in for wins, warnings and failures. */
    li::before {
      content: "";
      position: absolute;
      inset: 0 -10px;
      z-index: -1;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
    }

    /* A custom round checkbox. It is still a real checkbox underneath. */
    li input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      flex: none;
      width: 26px;
      height: 26px;
      margin: 0;
      border: 2px solid var(--muted);
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s, border-color 0.15s;
    }

    li input[type="checkbox"]::after {
      content: "";
      width: 6px;
      height: 12px;
      margin-top: -2px;
      border: solid var(--accent-ink);
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg) scale(0);
      transition: transform 0.15s;
    }

    li input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    li input[type="checkbox"]:checked::after {
      transform: rotate(45deg) scale(1);
    }

    /* The task text and the timer info sit together in one column */
    .task-body {
      flex: 1;
      min-width: 0;
    }

    li label {
      display: block;
      padding-top: 1px;
      cursor: pointer;
      overflow-wrap: anywhere;
      text-decoration: line-through;
      text-decoration-color: transparent;
      transition: color 0.2s, text-decoration-color 0.2s;
    }

    /* A finished task: grey text with a line through it */
    li.done label {
      color: var(--done);
      text-decoration-color: currentColor;
    }

    .delete {
      flex: none;
      width: 32px;
      height: 32px;
      font-size: 22px;
      line-height: 1;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 8px;
    }

    .delete:hover { color: var(--danger); }

    /* ---------- New: timer info under each task ---------- */

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 10px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .timer { font-variant-numeric: tabular-nums; }

    /* The three dots show how many snoozes are left */
    .dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dots i.used {
      background: transparent;
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }

    .dots span { margin-right: 2px; }

    /* The shrinking bar */
    .bar {
      height: 6px;
      margin-top: 8px;
      overflow: hidden;
      background: var(--line);
      border-radius: 999px;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transform-origin: left center;
      transform: scaleX(var(--p, 1));
      transition: transform 1s linear, background 0.3s;
    }

    .badge {
      padding: 1px 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--card);
      background: var(--alert);
      border-radius: 6px;
    }

    /* The three snooze choices (half, full, one third) shown when time is up */
    .snooze-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .snooze {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 8px 6px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      color: var(--accent);
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 12px;
    }

    /* The one that starts by itself if you do nothing */
    .snooze.default {
      color: var(--accent-ink);
      background: var(--accent);
    }

    .snooze-time {
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- New: how each state looks ---------- */

    /* Running low on time (the last quarter) */
    li.warning .timer { color: var(--warn); font-weight: 600; }
    li.warning .bar-fill { background: var(--warn); }

    /* Time is up but snoozes are left: the row glows red and breathes */
    li.overdue input[type="checkbox"],
    li.failed input[type="checkbox"] { border-color: var(--alert); }

    li.overdue .timer,
    li.failed .timer { color: var(--alert); font-weight: 600; }

    li.overdue .bar,
    li.failed .bar { background: var(--alert-tint-strong); }

    li.overdue::before {
      opacity: 1;
      background: var(--alert-tint);
      box-shadow: inset 0 0 0 1.5px var(--alert);
      animation: breathe 1.6s ease-in-out infinite;
    }

    /* While overdue, the bar drains over the 10 seconds you have to pick a snooze */
    li.overdue .bar-fill { background: var(--alert); }

    /* Out of time AND out of snoozes: the task is missed */
    li.failed::before {
      opacity: 1;
      background: var(--alert-tint);
    }

    /* Finished */
    li.done .timer { color: var(--good); }
    li.late .timer { color: var(--warn); }

    /* ---------- New: one-time animations ----------
       The JavaScript adds these classes for a moment, then removes them. */

    /* A win: the checkbox pops and the row flashes green */
    li.anim-win::before {
      background: var(--good-tint);
      animation: flash-fade 1.1s ease-out;
    }

    li.anim-win input[type="checkbox"] {
      animation: pop 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
    }

    /* Time just ran out: a quick jolt */
    li.anim-overdue { animation: jolt 0.5s ease-out; }

    /* Failure: the whole row shakes, flashes red, and "Missed" is stamped on */
    li.anim-fail { animation: shake 0.6s ease-out; }
    li.anim-fail::before { animation: flash-bad 1.4s ease-out; }
    li.anim-fail .badge { animation: stamp 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) 0.25s backwards; }

    /* Snooze: the row nods and the bar refills */
    li.anim-snooze { animation: nod 0.5s ease-out; }
    li.anim-snooze .bar-fill { animation: refill 0.8s ease-out; }

    /* Everything finished: the card glows and the counter bumps */
    .card.celebrate { animation: glow 1.4s ease-out; }
    #count.bump { animation: bump 0.5s ease-out; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.4); }
      100% { transform: scale(1); }
    }

    @keyframes flash-fade {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    @keyframes jolt {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      12% { transform: translateX(-9px); }
      24% { transform: translateX(8px); }
      36% { transform: translateX(-7px); }
      48% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      72% { transform: translateX(3px); }
      86% { transform: translateX(-1px); }
    }

    @keyframes flash-bad {
      0%, 35% { background: var(--alert-tint-strong); }
      100%    { background: var(--alert-tint); }
    }

    @keyframes stamp {
      0%   { transform: scale(3) rotate(-14deg); opacity: 0; }
      60%  { transform: scale(0.92) rotate(3deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    @keyframes nod {
      0%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
      60% { transform: translateY(2px); }
    }

    @keyframes refill {
      from { transform: scaleX(0); }
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 8px 30px rgba(20, 40, 50, 0.08); }
      35%      { box-shadow: 0 0 0 4px var(--good), 0 12px 44px var(--good-tint); }
    }

    @keyframes bump {
      0%, 100% { transform: scale(1); }
      40%      { transform: scale(1.12); }
    }

    /* Confetti pieces live in this layer, on top of everything */
    #effects {
      position: fixed;
      inset: 0;
      z-index: 40;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 12px;
      border-radius: 2px;
    }

    /* The message bubble at the bottom of the screen */
    #toast {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: min(92vw, 420px);
      padding: 12px 18px;
      font-size: 16px;
      line-height: 1.3;
      color: #e6eef2;
      background: #0f1d24;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      opacity: 0;
      transform: translate(-50%, 24px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.35s cubic-bezier(0.2, 1.2, 0.4, 1);
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .toast-icon {
      flex: none;
      font-size: 20px;
      line-height: 1;
      color: #f2b84b;
    }

    #toast[data-kind="bad"] .toast-icon { color: #ff8a80; }

    /* Message shown when the list is empty */
    #empty {
      margin: 20px 0 12px;
      color: var(--muted);
      text-align: center;
    }

    #clear-btn {
      display: block;
      margin: 12px auto 0;
      padding: 6px 12px;
      font-size: 15px;
      color: var(--muted);
      background: transparent;
      border: none;
      text-decoration: underline;
    }

    #clear-btn:disabled { opacity: 0.4; cursor: default; }

    /* The "Install app" button. It only appears when the browser says the app can be installed. */
    #install-btn {
      display: block;
      margin: 16px auto 0;
      padding: 8px 20px;
      font-weight: 600;
      color: var(--accent-ink);
      background: var(--accent);
      border: none;
      border-radius: 999px;
    }

    #install-btn[hidden] { display: none; }

    #ios-hint { text-align: center; }

    /* The sign-in area: a small link, and a panel that opens when you tap it */
    #account {
      margin-top: 16px;
      text-align: center;
    }

    #account-toggle {
      padding: 6px 12px;
      font-size: 15px;
      color: var(--muted);
      background: transparent;
      border: none;
      text-decoration: underline;
    }

    #account-toggle[hidden] { display: none; }

    #account-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 320px;
      margin: 10px auto 0;
      text-align: left;
    }

    #account-panel[hidden] { display: none; }

    #account-panel input {
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--line);
      border-radius: 10px;
    }

    #account-panel input::placeholder { color: var(--muted); }

    .auth-buttons { display: flex; gap: 8px; }

    .auth-buttons button {
      flex: 1;
      padding: 10px;
      font-weight: 600;
      color: var(--accent);
      background: transparent;
      border: 1.5px solid var(--accent);
      border-radius: 10px;
    }

    #signin-btn {
      color: var(--accent-ink);
      background: var(--accent);
    }

    /* Text only screen readers need */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* Respect people who turn animations off on their device.
       The colors and words still show what is happening. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<!-- ============================================================
     PAGE CONTENT (HTML): what is on the page
     ============================================================ -->
<body>
  <main class="card">
    <h1>To-do list</h1>
    <p id="count" aria-live="polite"></p>

    <div id="add-form" role="group" aria-label="Add a task">
      <div class="add-row">
        <label for="new-task" class="sr-only">New task</label>
        <input id="new-task" type="text" placeholder="What needs doing?" maxlength="120" autocomplete="off">
        <button type="button" id="add-btn">Add task</button>
      </div>

      <!-- The number is the time limit in seconds. 0 means no limit. -->
      <div class="limit-row">
        <label for="time-limit">Time limit</label>
        <select id="time-limit">
          <option value="0">No time limit</option>
          <option value="30">30 seconds (quick test)</option>
          <option value="300">5 minutes</option>
          <option value="900">15 minutes</option>
          <option value="1800">30 minutes</option>
          <option value="3600">1 hour</option>
          <option value="7200">2 hours</option>
        </select>
      </div>
      <p id="limit-hint" class="hint"></p>
    </div>

    <div class="filters" role="group" aria-label="Show tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">To do</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="list"></ul>
    <p id="empty"></p>

    <button type="button" id="clear-btn">Clear finished tasks</button>

    <!-- Sign in to keep your tasks in your online account and see them on every device.
         This is a plain group, not a form, because forms get blocked in some preview panes. -->
    <section id="account" aria-label="Account and sync">
      <p id="sync-status" class="hint" role="status"></p>
      <button type="button" id="account-toggle">Sign in to sync across devices</button>

      <div id="account-panel" hidden>
        <label for="auth-email" class="sr-only">Email</label>
        <input id="auth-email" type="email" placeholder="Email" autocomplete="email">
        <label for="auth-password" class="sr-only">Password</label>
        <input id="auth-password" type="password" placeholder="Password (6 or more characters)" autocomplete="current-password">
        <div class="auth-buttons">
          <button type="button" id="signin-btn">Sign in</button>
          <button type="button" id="signup-btn">Create account</button>
        </div>
        <p id="auth-message" class="hint" role="status"></p>
      </div>
    </section>

    <!-- Hidden until the browser says the app can be installed -->
    <button type="button" id="install-btn" hidden>Install app</button>
    <p id="ios-hint" class="hint" hidden>To install on iPhone or iPad: tap the Share button, then Add to Home Screen.</p>
  </main>

  <!-- Confetti is drawn here -->
  <div id="effects" aria-hidden="true"></div>

  <!-- Short messages ("Beat the clock!", "Time's up") appear here -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- The Supabase library: it talks to your online database.
       It is pinned to one exact version so it never changes under you.
       If it cannot load, the app still works on this device, just without syncing. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3" crossorigin="anonymous"></script>

  <!-- ============================================================
       BEHAVIOR (JavaScript): what the page does
       ============================================================ -->
  <script>
    // The browser remembers your tasks under this name, even after you close the page.
    const STORAGE_KEY = "my-todo-tasks";
    const DELETES_KEY = "my-todo-pending-deletes";  // tasks deleted here that still need deleting online
    const SNOOZE_LOG_KEY = "my-todo-snooze-log";    // snoozes that still need saving online

    // ---------- Settings you can change ----------

    const MAX_SNOOZES = 3;             // how many snoozes each task gets
    const AUTO_SNOOZE_SECONDS = 10;    // when time is up, you have this long to pick a snooze
    const MIN_SNOOZE_SECONDS = 5;      // a snooze is never shorter than this
    const WARNING_FRACTION = 0.25;     // the timer turns amber in the last 25% of the time

    // The three snooze choices. "fraction" is a share of the time you originally gave the task.
    const SNOOZE_OPTIONS = [
      { key: "half",  label: "Half",      words: "half the time",        fraction: 1 / 2 },
      { key: "full",  label: "Full",      words: "the full time again",  fraction: 1 },
      { key: "third", label: "One third", words: "one third of the time", fraction: 1 / 3 }
    ];

    // If you do not choose in time, this one starts by itself.
    const DEFAULT_SNOOZE = "half";

    // ---------- Working out what state a task is in ----------

    // Every task is always in exactly one of these states:
    //   "plain"    no time limit
    //   "running"  counting down
    //   "warning"  counting down, last quarter of the time
    //   "overdue"  time is up and snoozes are left: you have 10 seconds to pick one,

    //   "failed"   time is up and no snoozes are left
    //   "done"     finished in time (or no limit)
    //   "late"     finished after time ran out
    function getState(task) {
      if (task.done) return task.late ? "late" : "done";
      if (!task.deadline) return "plain";

      const left = task.deadline - Date.now();
      if (left <= 0) return task.snoozesLeft > 0 ? "overdue" : "failed";

      const total = (task.windowSec || task.limitSec) * 1000;
      if (left <= total * WARNING_FRACTION) return "warning";
      return "running";

    function findTask(id) {
      return tasks.find(function (t) { return t.id === id; });

    // 75 becomes "1:15", 3700 becomes "1:01:40"
    function formatTime(totalSeconds) {
      const s = Math.max(0, Math.round(totalSeconds));
      const hours = Math.floor(s / 3600);
      const minutes = Math.floor((s % 3600) / 60);
      const seconds = String(s % 60).padStart(2, "0");
      if (hours > 0) return hours + ":" + String(minutes).padStart(2, "0") + ":" + seconds;
      return minutes + ":" + seconds;

    // Starts the next snooze. "startedAt" is the moment the snooze begins,
    // and "wasAuto" is true when it started by itself.
    function startSnooze(task, key, startedAt, wasAuto) {
      const seconds = snoozeSecondsFor(task, key);
      task.deadline = startedAt + seconds * 1000;
      task.windowSec = seconds;
      task.snoozesLeft -= 1;
      touch(task);

      // Keep a record of this snooze, to be saved online later
      snoozeLog.push({ taskId: task.id, choice: key, seconds: seconds, auto: !!wasAuto, at: startedAt });

    function applyAutoSnoozes() {

    // render() rebuilds everything on screen from the tasks list.
    // Call it after any change, and the page always matches the data.
    function render() {
      // 1. Work out which tasks to show
      const visible = tasks.filter(function (t) {
        if (currentFilter === "active") return !t.done;
        if (currentFilter === "done") return t.done;

        li.dataset.id = task.id;
        if (state === "done" || state === "late") li.classList.add("done");
        if (state === "late" || state === "warning" || state === "overdue" || state === "failed") {
          li.classList.add(state);

        checkbox.type = "checkbox";
        checkbox.id = "task-" + task.id;
        checkbox.checked = task.done;
        checkbox.dataset.id = task.id;

      const left = tasks.filter(function (t) { return !t.done; }).length;
      const missed = tasks.filter(function (t) { return getState(t) === "failed"; }).length;
      if (tasks.length === 0) {
        countText.textContent = "No tasks yet";
      } else if (left === 0) {
        countText.textContent = "All done";
      } else {
        let text = left + (left === 1 ? " task left" : " tasks left");
        if (missed > 0) text += ", " + missed + " missed";
        countText.textContent = text;
      }

      // 4. Show a helpful message if the list is empty
      if (visible.length > 0) {
        emptyText.textContent = "";

        emptyText.textContent = "Nothing left to do.";
      } else if (currentFilter === "done") {

    // ---------- The clock ----------

    // Runs once a second. If a task changed state (for example, time just ran out),
    // it redraws and plays the right animation. Otherwise it only updates the numbers,
    // so nothing flickers.
    function tick() {
      // First, start a snooze for any task that has waited 10 seconds without a choice
      const autoSnoozed = applyAutoSnoozes();

      const affected = tasks.filter(function (t) {
        return autoSnoozed.indexOf(t) !== -1 || getState(t) !== shownState[t.id];
      });

      if (affected.length === 0) {
        updateTimers();
        return;
      }

      render();
      affected.forEach(function (task) {
        const state = getState(task);
        if (state === "overdue" || state === "failed") {
          announceChange(task, state);
        } else if (autoSnoozed.indexOf(task) !== -1) {
          announceAutoSnooze(task);
        }
      });
    }

      list.querySelectorAll("li[data-id]").forEach(function (li) {
        const task = findTask(li.dataset.id);
        if (!task || !task.deadline || task.done) return;
        fillTimer(li, task, getState(task));

    // ---------- Animations and messages ----------

    function animateRow(id, className) {

      toast.classList.add("show");

      toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3600);

    function shorten(text, max) {
      return text.length > max ? text.slice(0, max - 1) + "\u2026" : text;
    }

    // Decides how big the celebration is and what the message says.
    function achievement(task, allDone) {
      if (allDone) {
        return { icon: "\u2605", text: "All done! Clean sweep.", confetti: 40 };
      }
      if (task.late) {
        return { icon: "\u2713", text: "Finished late. Better than never.", confetti: 0 };
      }
      if (task.deadline) {
        const spare = formatTime(task.spareSec);
        if (task.snoozesLeft < MAX_SNOOZES) {
          return { icon: "\u2605", text: "Phew! Saved by the snooze.", confetti: 14 };
        }
        if (task.spareSec >= task.limitSec * 0.5) {

        }
        return { icon: "\u2605", text: "Beat the clock! " + spare + " to spare.", confetti: 22 };
      }
      return { icon: "\u2713", text: "Task complete.", confetti: 16 };
    }

    function celebrate(task, box) {
      const allDone = tasks.every(function (t) { return t.done; });
      const win = achievement(task, allDone);

      if (!task.late) animateRow(task.id, "anim-win");

      if (win.confetti > 0 && box) {

    const CONFETTI_COLORS = ["#f2b84b", "#e8604c", "#4fb8c0", "#7bd389", "#9b8cff", "#ff8fb1"];

    // Confetti that flies out from one point (the checkbox you just ticked)
    function burst(x, y, count) {
      if (reduceMotion.matches) return;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = x + "px";
        piece.style.top = y + "px";
        piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];

        const angle = Math.random() * Math.PI * 2;
        const distance = 60 + Math.random() * 100;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance - 40; // fly upward a little first
        const spin = Math.random() * 720 - 360;

        const motion = piece.animate([
          { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
          { transform: "translate(" + dx + "px, " + dy + "px) rotate(" + spin / 2 + "deg)", opacity: 1, offset: 0.6 },
          { transform: "translate(" + dx * 1.1 + "px, " + (dy + 90) + "px) rotate(" + spin + "deg)", opacity: 0 }
        ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(0.2, 0.7, 0.3, 1)" });

        motion.onfinish = function () { piece.remove(); };
      }
    }

    // Confetti that falls from the top of the screen (for finishing everything)
    function rain(count) {
      if (reduceMotion.matches) return;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = Math.random() * window.innerWidth + "px";
        piece.style.top = "-20px";
        piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        effects.appendChild(piece);

        const sway = Math.random() * 120 - 60;
        const spin = Math.random() * 900 - 450;

        const motion = piece.animate([
          { transform: "translate(0, 0) rotate(0deg)" },
          { transform: "translate(" + sway + "px, " + (window.innerHeight + 60) + "px) rotate(" + spin + "deg)" }
        ], {
          duration: 1800 + Math.random() * 1400,
          delay: Math.random() * 700,
          easing: "ease-in",
          fill: "backwards"
        });

        motion.onfinish = function () { piece.remove(); };
      }
    }

    // ---------- Reacting to clicks and typing ----------

    // Add a task from whatever is typed in the box.
    // We do not use a <form> here, because some places that show web pages
    // (like preview panes) block forms and the button would do nothing.
    function submitTask() {
      const text = input.value.trim();
      if (text === "") return;
      addTask(text, Number(timeLimit.value));
      input.value = "";
      input.focus();
    }

    addBtn.addEventListener("click", submitTask);

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        submitTask();
      }
    });

    // Explain the snooze rule under the picker whenever a time limit is chosen
    function updateHint() {
      limitHint.textContent = Number(timeLimit.value) === 0
        ? ""
        : "If time runs out you get " + MAX_SNOOZES + " snoozes. Choose half, full or one third of your time within "
          + AUTO_SNOOZE_SECONDS + " seconds, or half starts on its own.";
    }
    timeLimit.addEventListener("change", updateHint);
    updateHint();

    // One listener on the whole list handles every checkbox and button
    list.addEventListener("change", function (event) {
      if (event.target.matches("input[type='checkbox']")) {
        toggleTask(event.target.dataset.id, event.target.getBoundingClientRect());
      }
    });

    list.addEventListener("click", function (event) {
      const button = event.target.closest("button");
      if (!button) return;

      const id = button.dataset.id;
      if (button.classList.contains("delete")) deleteTask(id);
      if (button.classList.contains("snooze")) snoozeTask(id, button.dataset.snooze);
    });

    filterButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    clearBtn.addEventListener("click", clearFinished);

    // ---------- Syncing with Supabase ----------

    // How it works, in short:
    //  - Every change is saved on this device first, so the app stays fast and works offline.
    //  - Changed tasks are marked "dirty". When you are signed in and online, we upload
    //    the dirty tasks, then download the full list from your account.
    //  - The online copy is the master copy, so a task you delete on your phone also
    //    disappears from your computer.

    let session = null;       // the signed-in user's session, or null when signed out
    let syncPromise = null;   // set while a sync is running
    let syncAgain = false;    // true if something changed while a sync was running
    let syncTimer = null;
    let syncState = "idle";   // "idle", "syncing", "synced", "offline" or "error"

    const accountToggle = document.getElementById("account-toggle");
    const accountPanel = document.getElementById("account-panel");
    const authEmail = document.getElementById("auth-email");
    const authPassword = document.getElementById("auth-password");
    const signinBtn = document.getElementById("signin-btn");
    const signupBtn = document.getElementById("signup-btn");
    const authMessage = document.getElementById("auth-message");
    const syncStatus = document.getElementById("sync-status");

    // Our task shape -> the database row shape (see schema.sql)
    function toRow(task) {
      return {
        id: task.id,
        title: task.text,
        done: task.done,
        limit_seconds: task.limitSec || null,
        window_seconds: task.deadline ? task.windowSec : null,
        deadline: task.deadline ? new Date(task.deadline).toISOString() : null,
        snoozes_left: task.deadline ? task.snoozesLeft : null,
        late: task.late === undefined ? null : task.late,
        spare_seconds: task.spareSec === undefined ? null : task.spareSec,
        completed_at: task.completedAt ? new Date(task.completedAt).toISOString() : null,
        created_at: new Date(task.createdAt).toISOString()
      };
    }

    // The database row shape -> our task shape
    function fromRow(row) {
      const task = {
        id: row.id,
        text: row.title,
        done: row.done,
        createdAt: Date.parse(row.created_at),
        synced: true,
        dirty: false,
        rev: 0
      };
      if (row.limit_seconds) {
        task.limitSec = row.limit_seconds;
        task.windowSec = row.window_seconds;
        task.deadline = Date.parse(row.deadline);
        task.snoozesLeft = row.snoozes_left;
      }
      if (row.late !== null) task.late = row.late;
      if (row.spare_seconds !== null) task.spareSec = row.spare_seconds;
      if (row.completed_at) task.completedAt = Date.parse(row.completed_at);
      return task;
    }

    // A short fingerprint of what is on screen, so we only redraw when something really changed
    function fingerprint() {
      return JSON.stringify(tasks.map(function (t) {
        return [t.id, t.text, t.done, t.deadline, t.windowSec, t.snoozesLeft, t.late, t.spareSec];
      }));
    }

    function setSyncState(state) {
      syncState = state;

      if (!cloud) {
        syncStatus.textContent = "Online sync is not available right now.";
        return;
      }
      if (!session) {
        syncStatus.textContent = "";
        return;
      }

      const messages = {
        idle: "",
        syncing: "Syncing\u2026",
        synced: "Synced",
        offline: "Offline. Changes will sync when you are back online.",
        error: "Could not sync. Trying again soon."
      };
      syncStatus.textContent = ("Signed in as " + session.user.email + ". " + messages[state]).trim();
    }

    // Waits a moment (so quick changes go up together), then syncs.
    function scheduleSync() {
      if (!cloud || !session) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncNow, 800);
    }

    // Starts a sync, or joins the one already running.
    function syncNow() {
      if (!cloud || !session) return Promise.resolve();

      if (syncPromise) {
        syncAgain = true;
        return syncPromise;
      }

      syncPromise = runSync().then(function () {
        syncPromise = null;
        if (syncAgain) {
          syncAgain = false;
          scheduleSync();
        }
      });
      return syncPromise;
    }

    async function runSync() {
      if (!navigator.onLine) {
        setSyncState("offline");
        return;
      }

      setSyncState("syncing");

      try {
        // 1. Delete online the tasks you deleted here
        if (pendingDeletes.length > 0) {
          const ids = pendingDeletes.slice();
          const result = await cloud.from("tasks").delete().in("id", ids);
          if (result.error) throw result.error;
          pendingDeletes = pendingDeletes.filter(function (id) { return ids.indexOf(id) === -1; });
          saveList(DELETES_KEY, pendingDeletes);
        }

        // 2. Upload the tasks that changed here
        const sent = tasks.filter(needsUpload).map(function (t) {
          return { task: t, rev: t.rev || 0 };
        });

        if (sent.length > 0) {
          const rows = sent.map(function (s) { return toRow(s.task); });
          const result = await cloud.from("tasks").upsert(rows, { onConflict: "id" });
          if (result.error) throw result.error;

          sent.forEach(function (s) {
            s.task.synced = true;
            // If the task changed again while uploading, it stays "dirty" for the next round
            if ((s.task.rev || 0) === s.rev) s.task.dirty = false;
          });
          saveTasks();
        }

        // 3. Download everything from your account
        const result = await cloud.from("tasks").select("*").order("created_at", { ascending: true });
        if (result.error) throw result.error;

        const before = fingerprint();

        // Skip tasks we just deleted here (the online delete may not have happened yet)
        const cloudTasks = result.data
          .map(fromRow)
          .filter(function (t) { return pendingDeletes.indexOf(t.id) === -1; });

        // For tasks with changes not uploaded yet, our version wins.
        // Tasks that exist only here (created while offline) are kept too.
        const localDirty = {};
        tasks.forEach(function (t) { if (needsUpload(t)) localDirty[t.id] = t; });

        const merged = cloudTasks.map(function (t) { return localDirty[t.id] || t; });
        tasks.forEach(function (t) {
          if (needsUpload(t) && !cloudTasks.some(function (c) { return c.id === t.id; })) merged.push(t);
        });

        tasks = merged;
        saveTasks();

        // 4. Save the snooze history online (only for tasks that exist online)
        if (snoozeLog.length > 0) {
          const known = {};
          cloudTasks.forEach(function (t) { known[t.id] = true; });

          const toSend = [];
          const toDrop = [];
          snoozeLog.forEach(function (e) {
            if (known[e.taskId]) toSend.push(e);
            else if (!findTask(e.taskId)) toDrop.push(e); // the task is gone, so forget its snoozes
          });

          if (toSend.length > 0) {
            const rows = toSend.map(function (e) {
              return {
                task_id: e.taskId,
                choice: e.choice,
                seconds: e.seconds,
                was_auto: e.auto,
                started_at: new Date(e.at).toISOString()
              };
            });
            const inserted = await cloud.from("snoozes").insert(rows);
            if (inserted.error) throw inserted.error;
          }

          snoozeLog = snoozeLog.filter(function (e) {
            return toSend.indexOf(e) === -1 && toDrop.indexOf(e) === -1;
          });
          saveList(SNOOZE_LOG_KEY, snoozeLog);
        }

        if (fingerprint() !== before) render();
        setSyncState("synced");
      } catch (error) {
        setSyncState(navigator.onLine ? "error" : "offline");
        clearTimeout(syncTimer);
        syncTimer = setTimeout(syncNow, 30000); // try again in 30 seconds
      }
    }

    // ---------- Signing in and out ----------

    async function signIn() {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || !password) {
        authMessage.textContent = "Enter your email and password.";
        return;
      }

      authMessage.textContent = "Signing in\u2026";
      try {
        const result = await cloud.auth.signInWithPassword({ email: email, password: password });
        if (result.error) {
          authMessage.textContent = result.error.message;
          return;
        }
        authMessage.textContent = "";
        authPassword.value = "";
      } catch (error) {
        authMessage.textContent = "Could not reach the server. Check your internet connection.";
      }
    }

    async function signUp() {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      if (!email || password.length < 6) {
        authMessage.textContent = "Enter your email and a password of 6 or more characters.";
        return;
      }

      authMessage.textContent = "Creating your account\u2026";
      try {
        const result = await cloud.auth.signUp({ email: email, password: password });
        if (result.error) {
          authMessage.textContent = result.error.message;
          return;
        }
        authPassword.value = "";
        // If your project asks people to confirm their email, there is no session yet.
        authMessage.textContent = result.data.session
          ? ""
          : "Check your email to confirm your account, then come back and sign in.";
      } catch (error) {
        authMessage.textContent = "Could not reach the server. Check your internet connection.";
      }
    }

    async function signOut() {
      await syncNow(); // upload anything still waiting

      const unsynced = tasks.some(needsUpload) || pendingDeletes.length > 0;
      if (unsynced && !window.confirm("Some changes have not synced yet and will be lost if you sign out. Sign out anyway?")) {
        return;
      }

      try {
        await cloud.auth.signOut();
      } catch (error) {
        // Even if this fails, we still sign out on this device.
      }

      // Your tasks stay safe in your account. Clear this device so the next person
      // who uses it does not see them.
      session = null;
      tasks = [];
      pendingDeletes = [];
      snoozeLog = [];
      saveTasks();
      saveList(DELETES_KEY, pendingDeletes);
      saveList(SNOOZE_LOG_KEY, snoozeLog);
      updateAccountUI();
      render();
      showToast("\u2713", "Signed out. Your tasks are saved in your account.", "win");
    }

    function updateAccountUI() {
      accountToggle.hidden = !cloud;
      accountToggle.textContent = session ? "Sign out" : "Sign in to sync across devices";
      if (session) accountPanel.hidden = true;
      setSyncState(syncState);
    }

    accountToggle.addEventListener("click", function () {
      if (session) {
        signOut();
      } else {
        accountPanel.hidden = !accountPanel.hidden;
        if (!accountPanel.hidden) authEmail.focus();
      }
    });

    signinBtn.addEventListener("click", signIn);
    signupBtn.addEventListener("click", signUp);

    authPassword.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        signIn();
      }
    });

    // Sync again when you come back online
    window.addEventListener("online", syncNow);
    window.addEventListener("offline", function () {
      if (session) setSyncState("offline");
    });

    if (cloud) {
      // Supabase tells us when you sign in, sign out, or when your saved session is found.
      cloud.auth.onAuthStateChange(function (event, newSession) {
        session = newSession;
        // Wait a moment: calling Supabase from inside this function can make it freeze.
        setTimeout(function () {
          updateAccountUI();
          if (session && (event === "SIGNED_IN" || event === "INITIAL_SESSION")) syncNow();
        }, 0);
      });
    }
    updateAccountUI();

    // ---------- Installing the app (PWA) ----------

    const installBtn = document.getElementById("install-btn");
    const iosHint = document.getElementById("ios-hint");
    let installPrompt = null; // the browser hands us this when the app can be installed

    // True when the app is already running as an installed app.
    const isInstalled = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;

    // Chrome, Edge and Android fire this event when the app is installable.
    // We keep it and show our own "Install app" button instead.
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      installPrompt = event;
      if (!isInstalled) installBtn.hidden = false;
    });

    installBtn.addEventListener("click", function () {
      if (!installPrompt) return;
      installPrompt.prompt(); // shows the browser's install question
      installPrompt.userChoice.then(function () {
        installPrompt = null;
        installBtn.hidden = true;
      });
    });

    window.addEventListener("appinstalled", function () {
      installBtn.hidden = true;
      showToast("\u2713", "App installed. Open it from your home screen.", "win");
    });

    // iPhones and iPads have no install event, so we show a hint instead.
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isIos && !isInstalled) iosHint.hidden = false;

    // The service worker (sw.js) saves the app so it opens with no internet.
    // If it cannot start (for example in a preview pane), the app still works normally.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    // The "Add a task" shortcut (long-press the app icon) opens the page with ?action=add
    if (new URLSearchParams(window.location.search).get("action") === "add") {
      input.focus();
    }

    // Catch up on anything that ran out while the page was closed,
    // draw the page for the first time, then start the clock
    applyAutoSnoozes();
    render();
    setInterval(tick, 1000);

    // Browsers slow timers down in background tabs, so catch up when you come back
    // It is also a good moment to pick up changes you made on another device.
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) {
        tick();
        syncNow();
      }
    });
  </script>
</body>
</html>
